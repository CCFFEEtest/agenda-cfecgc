# SAISIE WEB PROVISOIRE (avec le dossier saisie-web/, a retirer quand les mails passeront par n8n).
# Verifie ajouts.json sur chaque Pull Request qui le modifie (croix rouge = ne pas fusionner).
name: Verification des ajouts mail

on:
  pull_request:
    paths: [ajouts.json, "saisie-web/**", .github/workflows/saisie-web-verif.yml]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write     # pour poster le bilan en commentaire de la PR

jobs:
  verif:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verifier ajouts.json et resumer les changements
        shell: powershell
        run: |
          # Version en ligne (branche cible de la PR, sinon main) pour lister ajouts / suppressions / modifications
          $b = if ($env:GITHUB_BASE_REF) { $env:GITHUB_BASE_REF } else { 'main' }
          # cmd pour la redirection : PowerShell 5.1 abimerait les accents de la sortie de git
          cmd /c "git show origin/${b}:ajouts.json > `"$env:RUNNER_TEMP\base.json`""
          $sum = "$env:RUNNER_TEMP\resume.md"
          powershell -NoProfile -ExecutionPolicy Bypass -File .\saisie-web\verif-ajouts.ps1 -Base "$env:RUNNER_TEMP\base.json" -Resume $sum
          $code = $LASTEXITCODE
          Get-Content $sum -Raw -Encoding UTF8 | Add-Content $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          # Bilan en commentaire de la Pull Request (mis a jour a chaque nouveau commit)
          if ($env:PR) {
            gh pr comment $env:PR --body-file $sum --edit-last
            if ($LASTEXITCODE -ne 0) { gh pr comment $env:PR --body-file $sum }
          }
          exit $code
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
