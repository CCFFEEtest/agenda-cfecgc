# Regenere l'agenda 3 fois par jour (7h, 14h et 19h, heure de Paris) et le publie sur GitHub Pages.
name: Mise a jour de l'agenda

on:
  schedule:
    # Heures UTC : 7h/14h/19h a Paris = 6h/13h/18h UTC en hiver, 5h/12h/17h UTC en ete.
    # Les deux series sont declenchees ; le job "horaire" ne garde que celle qui tombe a 7h, 14h ou 19h a Paris.
    - cron: "7 5,6,12,13,17,18 * * *"
  workflow_dispatch:         # bouton "Run workflow" pour lancer a la main
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  horaire:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        name: Verifier l'heure de Paris
        run: |
          h=$(TZ=Europe/Paris date +%-H)
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$h" = 7 ] || [ "$h" = 14 ] || [ "$h" = 19 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "Mise a jour (Paris ${h}h)"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Pas l'heure (Paris ${h}h) : rien a faire"
          fi

  build:
    needs: horaire
    if: needs.horaire.outputs.run == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Recuperer les evenements et generer la page
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\fetch-agenda.ps1
          $code = $LASTEXITCODE
          Get-Content .\fetch.log -ErrorAction SilentlyContinue
          if ($code -ne 0) { exit $code }

      - name: Preparer le site
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force _site | Out-Null
          Copy-Item index.html, style.css _site\

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
